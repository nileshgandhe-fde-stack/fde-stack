kind: ZarfPackageConfig
metadata:
  name: aegisops-airgap-bundle
  description: "Self-contained BYOC & Air-Gapped K8s bundle for regulated enterprise enclaves"
  version: "1.0.0"

components:
  - name: aegisops-core
    required: true
    manifests:
      - name: hardened-enclave
        namespace: aegisops-enclave
        files:
          - k8s-hardened-byoc.yaml
    images: # added required images for BYOC & Air-Gapped K8s bundle
      - python:3.11-slim
      - postgres:15-alpine
      - nginx:alpine
