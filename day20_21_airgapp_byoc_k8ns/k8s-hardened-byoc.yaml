---
# 1. Default-Deny All Ingress and Egress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aegisops-enclave
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. UI Pods: Allow egress to API on port 8000 (and DNS resolution)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-egress
  namespace: aegisops-enclave
spec:
  podSelector:
    matchLabels:
      app: ui
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. API Pods: Allow ingress from UI (8000) and egress to Postgres (5432) + DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-traffic
  namespace: aegisops-enclave
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 4. Postgres Pods: Allow ingress only from API on port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: aegisops-enclave
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432

# added k8s-hardened-byoc.yaml to deploy a hardened BYOC & Air-Gapped K8s bundle with Postgres, API, and UI components
# 1. Postgres Database (Port 5432)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-postgres
  namespace: aegisops-enclave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: aegisops
            - name: POSTGRES_PASSWORD
              value: enclavepass123
            - name: POSTGRES_DB
              value: aegisopsdb

apiVersion: v1
kind: Service
metadata:
  name: aegisops-postgres
  namespace: aegisops-enclave
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# 2. API Backend (Port 8000)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-api
  namespace: aegisops-enclave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command: ["python3", "-m", "http.server", "8000"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-api
  namespace: aegisops-enclave
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
# 3. UI Frontend (Port 80)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-ui
  namespace: aegisops-enclave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-ui
  namespace: aegisops-enclave
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80